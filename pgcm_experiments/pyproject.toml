[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgcm-experiments"
version = "0.1.0"
description = "Reproducible PG-CM support-maintenance and integration experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
pgcm = "pgcm.cli:main"

[tool.setuptools.packages.find]
include = ["pgcm*"]
